name: checks

on:
  push:
  pull_request:

jobs:
  shell-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile bin/otp-clipboard-listener
      - name: Shell syntax
        run: bash -n install.sh scripts/uninstall.sh
      - name: Extractor tests
        run: |
          python3 -m pip install pytest
          python3 -m pytest tests/test_extractor.py -q
